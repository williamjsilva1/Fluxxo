<style>

input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:-1px;border-color:transparent}

code{background:var(--bg);padding:1px 5px;border-radius:5px;font-size:12.5px}
.hidden{display:none!important}
.app{display:flex;min-height:100vh}
.side{width:232px;background:var(--card);border-right:1px solid var(--bd);position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;padding:18px 12px;z-index:20}

table.tb{width:100%;border-collapse:collapse}

.tb .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-bottom:16px;overflow-x:auto}
.tabs button{padding:10px 14px;font-weight:600;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tabs button.on{color:var(--pri);border-color:var(--pri)}
.chart-box{position:relative;height:260px}
.brand small{display:block;font-size:11px;font-weight:600;color:var(--mut);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:#9aa5b1;flex-shrink:0}

.avatar .dot{position:absolute;right:-1px;bottom:-1px;border:2px solid var(--card)}
.side-foot .sf-nome{font-weight:600;color:var(--tx)}
.side.side-escuro{background:#141a22;border-color:#141a22}
.side.side-cor{background:var(--pri);border-color:var(--pri)}

.side-escuro .brand,.side-cor .brand,.side-escuro .sf-nome,.side-cor .sf-nome{color:#fff}
.side-escuro .brand small,.side-cor .brand small,.side-escuro .side-foot,.side-cor .side-foot{color:rgba(255,255,255,.65);border-color:rgba(255,255,255,.12)}
body.compacto .card{padding:12px 14px}
body.compacto .row{padding:7px 4px}
body.compacto .grid{gap:12px}
body.compacto .main{padding-top:18px}
body.compacto .kpi .vl{font-size:19px}
body.compacto .nav a{padding:8px 12px}
body.ro .fab,body.ro .fab-menu,body.ro [data-act=novaConta],body.ro [data-act=novoCartao],body.ro [data-act=novaMeta],body.ro [data-act=novo],body.ro [data-act=editConta],body.ro [data-act=ajustarSaldo],body.ro [data-act=arqConta],body.ro [data-act=delConta],body.ro [data-act=editCartao],body.ro [data-act=pagarFatura],body.ro [data-act=pagarFaturaX],body.ro [data-act=editMeta],body.ro [data-act=aporte],body.ro [data-act=dupLanc],body.ro [data-act=delLanc],body.ro [data-act=copiarOrc],body.ro button[data-act=editOrc],body.ro [data-act=novoInv],body.ro [data-act=invAporte],body.ro [data-act=invResgate],body.ro [data-act=editInv],body.ro [data-act=editIndices]{display:none!important}
body.ro button.st{pointer-events:none}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.sec-t{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px}
.warn{background:var(--red-l);color:var(--red);border-radius:10px;padding:9px 12px;font-size:13px;margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){
 .side{inset:auto 0 0 0;width:auto;height:64px;flex-direction:row;padding:0;border-right:0;border-top:1px solid var(--bd)}
 .brand,.side-foot{display:none}
 .nav{display:flex;width:100%;overflow-x:auto}
 .nav a{flex-direction:column;gap:1px;font-size:10.5px;padding:8px 6px;min-width:74px;margin:0;border-radius:0;justify-content:center}
 .main{margin-left:0;padding:16px 16px 150px}
 .g3,.g2{grid-template-columns:minmax(0,1fr)}

 .kpi .vl{font-size:17px}
 .card{padding:14px}
 .mesnav span{min-width:120px}

}
</style>

<div id="loading">Carregando…</div>

<script>
'use strict';
/* ==========================================================================
   FLUXXO — Controle Financeiro (SPA single-file, vanilla JS + Firebase)
   --------------------------------------------------------------------------
   Seções:  1. Config/estado   2. Utilitários   3. Camada de dados
            4. Regras de negócio   5. Seeds   6. Autenticação/usuários/presença
            7. Views   8. Modais/formulários   9. Importação/exportação
            10. Configurações (aparência, menus, usuários, perfil)   11. Eventos/inicialização
   Firestore (base compartilhada entre os usuários aprovados):
     config/app                {nomeApp,subtitulo,logo,logoImg,corPrimaria,menuEstilo,temaPadrao,densidade,raio,fonte,menu{}}
     usuarios/{uid}            {nome,email,papel:'admin'|'editor'|'visualizador',status:'pendente'|'ativo'|'bloqueado',online,ultimoAcesso}
     convites/{email}          {email,papel,criadoEm,por}
     contas|cartoes|categorias|lancamentos|orcamentos|metas/{id}
   Regras de segurança: arquivo firestore.rules do pacote de deploy.
   ========================================================================== */

// ===== 1. CONFIG / ESTADO =====
// Preencha com o firebaseConfig do seu projeto. Vazio = modo demonstração (dados no navegador).
const firebaseConfig = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};
const SDK_OK = typeof firebase !== 'undefined';
const FIREBASE_ATIVO = !!firebaseConfig.apiKey && SDK_OK;
const LS_KEY = 'fluxxo_demo_v1';
const COLS = ['contas','cartoes','categorias','lancamentos','orcamentos','metas','investimentos'];
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MES_C = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const CORES = ['#12a150','#29a383','#0ea5a4','#2f7cf6','#3e63dd','#8e4ec6','#e93d82','#e5484d','#f76b15','#f5a524','#ad7f58','#5b6b7b'];
const ICONES = ['🍽️','🛒','🚗','⛽','🏠','💡','📺','📱','💊','🏥','📚','🎓','🎉','🎮','✈️','🛍️','👕','💇','🏋️','🐶','👶','🎁','🧾','🔧','☕','🍺','📦','💼','💻','📈','💰','🏦','💳','🎯','🛟','❔'];
const TIPOS_CONTA = {corrente:['Conta corrente','🏦'],poupanca:['Poupança','🐷'],carteira:['Carteira','👛'],investimento:['Investimento','📈'],outro:['Outro','💼']};
const BANDEIRAS = ['Mastercard','Visa','Elo','American Express','Hipercard','Outra'];
const TIPO_NOME = {receita:'Receita',despesa:'Despesa',transferencia:'Transferência',pgto_fatura:'Pagamento de fatura',aplicacao:'Aplicação',resgate:'Resgate',meta_aporte:'Guardado em meta',meta_retirada:'Retirada de meta'};
const F0 = {tipo:'',origem:'',cat:'',status:'',busca:''};
const ADMIN_BOOTSTRAP = 'williamjsilva1@gmail.com';   // sempre administrador (também nas regras)
const COLS_SIS = ['config','usuarios','convites'];
const PAPEIS = {admin:['Administrador','Acesso total: dados, usuários, aparência e configurações','b-green'],
  editor:['Editor','Cria e edita lançamentos, contas, cartões, planejamento e metas','b-blue'],
  visualizador:['Visualizador','Somente consulta, sem alterar dados','']};
const CFG_PADRAO = {id:'app',nomeApp:'Fluxxo',subtitulo:'Controle financeiro',logo:'💸',logoImg:'',corPrimaria:'#12a150',
  menuEstilo:'claro',temaPadrao:'auto',densidade:'normal',raio:'medio',fonte:'system',menu:{}};
const FONTES = {system:'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif',Inter:'"Inter",system-ui,sans-serif',
  Poppins:'"Poppins",system-ui,sans-serif',Roboto:'"Roboto",system-ui,sans-serif',Nunito:'"Nunito",system-ui,sans-serif',Montserrat:'"Montserrat",system-ui,sans-serif'};

let auth = null, fs = null, user = null, perfil = null, unsubs = [], charts = [], _rt = null, _perfilUnsub = null, _entrou = false, _presTimer = null;
const db = {}; COLS.concat(COLS_SIS).forEach(c => db[c] = []);
const VIEWS = {}, AFTER = {}, ACT = {}, FORMS = {}, CHG = {}, INP = {};
const S = {
  view:'dashboard', mes:hoje().slice(0,7), f:{...F0}, cartaoSel:null, faturaMes:null,
  rel:{tipo:'mes', ano:hoje().slice(0,4), de:hoje().slice(0,8)+'01', ate:hoje(), tab:'desp'},
  cfgTab:'categorias', catTab:'despesa', authMode:'login', fab:false, onConfirm:null, imp:null
};

// ===== 2. UTILITÁRIOS =====
function pad(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function hoje(){ return ymd(new Date()); }
function addMes(ym,n){ let y=+ym.slice(0,4), m=+ym.slice(5,7)-1+n; y+=Math.floor(m/12); m=((m%12)+12)%12; return y+'-'+pad(m+1); }
function ultimoDia(ym){ const y=+ym.slice(0,4), m=+ym.slice(5,7); return ym+'-'+pad(new Date(y,m,0).getDate()); }
function diaValido(ym,d){ return ym+'-'+pad(Math.min(Math.max(1,+d||1), +ultimoDia(ym).slice(8))); }
function addMesData(data,n){ return diaValido(addMes(data.slice(0,7),n), +data.slice(8,10)); }
function mesesEntre(a,b){ return (+b.slice(0,4)-+a.slice(0,4))*12 + (+b.slice(5,7)-+a.slice(5,7)); }

function parseValor(s){
  if(typeof s==='number') return s;
  s = String(s||'').trim().replace(/[R$\s]/g,'');
  if(s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');   // "1.000" = mil
  const v = parseFloat(s); return isNaN(v) ? 0 : v;
}

// ===== 3. CAMADA DE DADOS =====
// Todas as gravações passam por commit(ops). ops = [{op:'set',c,obj} | {op:'del',c,id}]
function limpar(o){ const r={}; for(const k in o){ if(o[k]!==undefined) r[k]=o[k]; } return r; }
function colRef(c){ return fs.collection(c); }
function salvarLocal(){ lsSet(LS_KEY, JSON.stringify(db)); }
function carregarLocal(){
  try{ const j=JSON.parse(lsGet(LS_KEY)||'null'); if(j && Array.isArray(j.categorias)){ COLS.concat(COLS_SIS).forEach(c=>db[c]=Array.isArray(j[c])?j[c]:[]); if(!db.config.length) db.config=[{...CFG_PADRAO}]; if(!db.usuarios.length) db.usuarios=seedUsuariosDemo(); return true; } }catch(e){}
  return false;
}
async function commit(ops){
  if(!ops.length) return;
  const negado = ops.find(o => (COLS.includes(o.c) || (o.c==='config' && o.obj && o.obj.id==='indices')) ? !podeEditar() : (o.c==='usuarios' ? !(ehAdmin() || (user && (o.id||o.obj.id)===user.uid)) : !ehAdmin()));
  if(negado){ toast('Você não tem permissão para esta alteração.',true); throw new Error('sem permissão'); }
  if(!FIREBASE_ATIVO){
    for(const o of ops){
      const arr=db[o.c], id=o.op==='del'?o.id:o.obj.id, i=arr.findIndex(x=>x.id===id);
      if(o.op==='del'){ if(i>=0) arr.splice(i,1); }
      else { const v=limpar(o.obj); if(i>=0) arr[i]=v; else arr.push(v); }
    }
    salvarLocal(); if(ops.some(o=>o.c==='config')) aplicarLayout(); render(); return;
  }
  for(let i=0;i<ops.length;i+=450){
    const chunk=ops.slice(i,i+450);
    const run=async()=>{ const b=fs.batch(); chunk.forEach(o=>{ const ref=colRef(o.c).doc(o.op==='del'?o.id:o.obj.id); if(o.op==='del') b.delete(ref); else b.set(ref,limpar(o.obj)); }); await b.commit(); };
    try{ await run(); }
    catch(e){
      console.error('[commit] 1ª tentativa', e);
      try{ await new Promise(r=>setTimeout(r,900)); await run(); }
      catch(e2){ console.error('[commit] falhou', e2); toast('Falha ao salvar: '+(e2.message||e2), true); throw e2; }
    }
  }
}
const fbSet = (c,obj) => commit([{op:'set',c,obj}]);
const fbDel = (c,id)  => commit([{op:'del',c,id}]);

function iniciarListeners(){
  unsubs.forEach(u=>u()); unsubs=[];
  const cols = COLS.concat(['config']).concat(ehAdmin()?['usuarios','convites']:[]);
  if(!ehAdmin()){ db.usuarios=[]; db.convites=[]; }
  let pend = cols.length;
  cols.forEach(c=>{
    let primeiro = true;
    unsubs.push(colRef(c).onSnapshot(snap=>{
      db[c] = snap.docs.map(d=>({...d.data(), id:d.id}));   // sempre reatribui em db[c] (nunca guardar referência do array)
      if(c==='config'){ lsSet('fluxxo_cfg',JSON.stringify(cfg())); aplicarLayout(); }
      if(primeiro){ primeiro=false; if(--pend===0) pronto(); }
      else if(c==='usuarios'||c==='convites'){ if(S.view==='config' && S.cfgTab==='usuarios') renderDebounced(); }
      else renderDebounced();
    }, err=>{ console.error('[snapshot]',c,err); toast('Erro de sincronização: '+err.message, true); if(primeiro){ primeiro=false; if(--pend===0) pronto(); } }));
  });
}

function tempoRel(iso){ if(!iso) return 'nunca'; const m=Math.round((Date.now()-Date.parse(iso))/60000); if(m<2) return 'agora'; if(m<60) return 'há '+m+' min'; const h=Math.round(m/60); if(h<24) return 'há '+h+' h'; const d=Math.round(h/24); return d<31?'há '+d+(d===1?' dia':' dias'):dataBR(iso.slice(0,10)); }

const byId = (c,id) => id ? db[c].find(x=>x.id===id) : undefined;
const CAT_NULA = {nome:'Sem categoria', icone:'❔', cor:'#8b98a5'};
function catDe(id){ return byId('categorias',id) || CAT_NULA; }
function catVisual(l){
  if(l.tipo==='transferencia') return {nome:'Transferência',icone:'🔄',cor:'#2f7cf6'};
  if(l.tipo==='pgto_fatura')   return {nome:'Pagamento de fatura',icone:'💳',cor:'#8e4ec6'};

function ehCartao(l){ return !!l.cartaoId && l.tipo!=='pgto_fatura'; }
// Competência: compras no cartão entram no mês da fatura; o resto pela data
function mesDe(l){ return ehCartao(l) && l.faturaRef ? l.faturaRef : (l.data||'').slice(0,7); }
function contasAtivas(){ return db.contas.filter(c=>!c.arquivada).sort((a,b)=>a.nome.localeCompare(b.nome)); }
function catsTipo(t){ return db.categorias.filter(c=>c.tipo===t).sort((a,b)=>a.nome.localeCompare(b.nome)); }
function origemNome(l){
  if(ehCartao(l)){ const c=byId('cartoes',l.cartaoId); return '💳 '+(c?c.nome:'Cartão'); }
  const c=byId('contas',l.contaId);
  if(l.tipo==='transferencia'){ const d=byId('contas',l.contaDestinoId); return (c?c.nome:'?')+' → '+(d?d.nome:'?'); }
  return c ? c.nome : '—';
}
function efeitoConta(l,id){
  switch(l.tipo){
    case 'receita': return !l.cartaoId && l.contaId===id ? +l.valor : 0;
    case 'despesa': return !l.cartaoId && l.contaId===id ? -l.valor : 0;
    case 'transferencia': return l.contaId===id ? -l.valor : (l.contaDestinoId===id ? +l.valor : 0);
    case 'pgto_fatura': case 'aplicacao': case 'meta_aporte': return l.contaId===id ? -l.valor : 0;
    case 'resgate': case 'meta_retirada': return l.contaId===id ? +l.valor : 0;
  }
  return 0;
}
function saldoContaOpt(c,ate,comPendentes){
  let s = +c.saldoInicial||0;
  for(const l of db.lancamentos){ if(ate && l.data>ate) continue; if(!comPendentes && !l.pago) continue; s += efeitoConta(l,c.id); }
  return r2(s);
}
function saldoConta(c){ return saldoContaOpt(c,null,false); }
function resumo(lista){
  let rec=0, desp=0, recPago=0, despPago=0;
  for(const l of lista){
    if(l.tipo==='receita' && !l.cartaoId){ rec+=+l.valor; if(l.pago) recPago+=+l.valor; }
    else if(l.tipo==='despesa'){ desp+=+l.valor; if(l.pago||ehCartao(l)) despPago+=+l.valor; }
  }
  return {rec:r2(rec), desp:r2(desp), recPago:r2(recPago), despPago:r2(despPago)};
}
function porCategoria(lista,tipo){
  const m={};
  for(const l of lista){ if(l.tipo!==tipo) continue; if(tipo==='receita' && l.cartaoId) continue; const k=l.categoriaId||'_'; m[k]=(m[k]||0)+ +l.valor; }
  return Object.entries(m).map(([k,v])=>({id:k, cat:k==='_'?CAT_NULA:catDe(k), valor:r2(v)})).sort((a,b)=>b.valor-a.valor);
}
// --- Cartões e faturas (faturaRef = mês de VENCIMENTO da fatura, 'YYYY-MM')
function faturaDe(c,data){
  const ym=data.slice(0,7), d=+data.slice(8,10);
  let f = d >= +c.fechamento ? addMes(ym,1) : ym;
  if(+c.vencimento <= +c.fechamento) f = addMes(f,1);
  return f;
}
function datasFatura(c,ym){
  const venc = diaValido(ym, c.vencimento);
  const fechMes = +c.vencimento > +c.fechamento ? ym : addMes(ym,-1);
  return {venc, fech:diaValido(fechMes, c.fechamento)};
}
function itensFatura(cid,ym){ return db.lancamentos.filter(l=>l.cartaoId===cid && ehCartao(l) && l.faturaRef===ym).sort((a,b)=>a.data.localeCompare(b.data)); }
function totalFatura(cid,ym){ return r2(itensFatura(cid,ym).reduce((s,l)=>s+(l.tipo==='receita'?-l.valor:+l.valor),0)); }
function pgtosFatura(cid,ym){ return db.lancamentos.filter(l=>l.tipo==='pgto_fatura' && l.cartaoId===cid && l.faturaRef===ym); }
function pagoFatura(cid,ym,soPagos){ return r2(pgtosFatura(cid,ym).filter(l=>!soPagos||l.pago).reduce((s,l)=>s+ +l.valor,0)); }
function restanteFatura(cid,ym){ return Math.max(0, r2(totalFatura(cid,ym)-pagoFatura(cid,ym,false))); }
function statusFatura(c,ym){
  const tot=totalFatura(c.id,ym), pg=pagoFatura(c.id,ym,true), {fech,venc}=datasFatura(c,ym), t=hoje();
  if(tot>0 && pg>=tot-0.005) return ['paga','Paga','b-green'];
  if(t<fech) return ['aberta','Aberta','b-blue'];
  if(tot<=0) return ['vazia','Sem gastos',''];
  if(t>venc) return ['atrasada','Vencida','b-red'];
  return ['fechada','Fechada','b-amber'];
}
function limiteUsado(c){
  let u=0;
  for(const l of db.lancamentos){
    if(l.cartaoId!==c.id) continue;
    if(l.tipo==='despesa') u+=+l.valor; else if(l.tipo==='receita') u-=+l.valor; else if(l.tipo==='pgto_fatura' && l.pago) u-=+l.valor;
  }
  return Math.max(0, r2(u));
}
function saldoPrevisto(ym){
  const fim=ultimoDia(ym);
  let s=contasAtivas().reduce((a,c)=>a+saldoContaOpt(c,fim,true),0);
  const hy=hoje().slice(0,7);
  if(ym>=hy) for(const cc of db.cartoes){ for(let m=hy, n=0; m<=ym && n<120; m=addMes(m,1), n++) s-=restanteFatura(cc.id,m); }
  return r2(s);
}

function orcDe(catId,ym){ return db.orcamentos.find(o=>o.categoriaId===catId && o.mes===ym) || db.orcamentos.find(o=>o.categoriaId===catId && o.mes==='padrao') || null; }

function mediaGasto(catId,ym){ let s=0; for(let i=1;i<=3;i++) s+=gastoCat(catId,addMes(ym,-i)); return r2(s/3); }
function corPct(p){ return p>=100 ? 'var(--red)' : p>=80 ? 'var(--amber)' : 'var(--pri)'; }
function grupo(l){ return l.grupoId ? db.lancamentos.filter(x=>x.grupoId===l.grupoId) : [l]; }
function sugerirCat(desc,tipo,estrito){
  const k=String(desc||'').toLowerCase().trim();
  if(k){ const m=db.lancamentos.filter(l=>l.tipo===tipo && l.categoriaId && (l.descricao||'').toLowerCase().trim()===k).sort((a,b)=>b.data.localeCompare(a.data))[0]; if(m) return m.categoriaId; }

  ];

// ===== 6. AUTENTICAÇÃO, USUÁRIOS E PRESENÇA =====
function traduzErro(e){
  const m={'auth/invalid-email':'E-mail inválido.','auth/user-not-found':'Usuário não encontrado.','auth/wrong-password':'Senha incorreta.',
    'auth/invalid-credential':'E-mail ou senha incorretos.','auth/email-already-in-use':'Este e-mail já está cadastrado.',
    'auth/weak-password':'A senha deve ter ao menos 6 caracteres.','auth/too-many-requests':'Muitas tentativas. Tente novamente mais tarde.',
    'auth/popup-closed-by-user':'Login cancelado.','auth/network-request-failed':'Falha de conexão.',
    'auth/unauthorized-domain':'Domínio não autorizado no Firebase (Authentication → Settings → Authorized domains).',
    'permission-denied':'Permissão negada pelas regras do Firestore. Publique o arquivo firestore.rules.'};
  return m[e && e.code] || (e && e.message) || 'Erro inesperado.';
}
function initFirebase(){
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth(); fs = firebase.firestore();
  fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  auth.onAuthStateChanged(async u=>{
    pararDados();
    if(!u){ user=null; perfil=null; mostrarAuth(); return; }
    user = u; $('#auth').classList.add('hidden'); $('#loading').classList.remove('hidden');
    try{ perfil = await garantirPerfil(); }
    catch(e){ console.error('[perfil]',e); return mostrarAuth('Não foi possível carregar seu perfil: '+traduzErro(e)); }
    observarPerfil();
  });
}
// Cria o documento usuarios/{uid} no primeiro acesso: bootstrap → admin; convite → papel do convite; demais → pendente
async function garantirPerfil(){
  const email=(user.email||'').toLowerCase(), ref=fs.collection('usuarios').doc(user.uid), snap=await ref.get();
  if(snap.exists) return {...snap.data(), id:user.uid};
  let pp='visualizador', status='pendente', convidado=false;
  if(email===ADMIN_BOOTSTRAP){ pp='admin'; status='ativo'; }
  else if(email){ try{ const cv=await fs.collection('convites').doc(email).get(); if(cv.exists){ pp=cv.data().papel||'visualizador'; status='ativo'; convidado=true; } }catch(e){} }
  const agora=new Date().toISOString();
  const p={nome:S.nomeCadastro||user.displayName||email.split('@')[0]||'Usuário', email, papel:pp, status, criadoEm:agora, ultimoAcesso:agora, online:true};
  await ref.set(p);
  if(convidado) fs.collection('convites').doc(email).delete().catch(()=>{});
  return {...p, id:user.uid};
}
function observarPerfil(){
  if(_perfilUnsub) _perfilUnsub();
  _entrou=false;
  _perfilUnsub = fs.collection('usuarios').doc(user.uid).onSnapshot(s=>{
    const antes=perfil ? perfil.papel+'|'+perfil.nome : '';
    perfil = s.exists ? {...s.data(), id:s.id} : null;
    if(!perfil){ if(!ehBoot()){ auth.signOut(); return; } perfil={id:user.uid,papel:'admin',status:'ativo',nome:user.displayName||user.email}; }
    if(perfil.status!=='ativo' && !ehBoot()){ pararDados(false); _entrou=false; telaBloqueio(perfil.status); return; }
    if(!_entrou){ _entrou=true; entrar(); return; }
    const depois=perfil.papel+'|'+perfil.nome;
    if(antes.split('|')[0]!==perfil.papel) iniciarListeners();
    else if(antes!==depois) renderDebounced();
  }, err=>{ console.error('[perfil]',err); mostrarAuth(traduzErro(err)); });
}
async function entrar(){
  $('#loading').classList.remove('hidden'); $('#auth').classList.add('hidden');
  if(ehAdmin()){ try{ await garantirSeed(); }catch(e){ console.error('[seed]',e); } }
  iniciarPresenca(); iniciarListeners();
}
function pararDados(tudo){
  unsubs.forEach(f=>f()); unsubs=[]; pararPresenca();
  if(tudo!==false && _perfilUnsub){ _perfilUnsub(); _perfilUnsub=null; }
  COLS.concat(COLS_SIS).forEach(c=>db[c]=[]);
}
async function garantirSeed(){
  const snap=await fs.collection('config').doc('app').get();
  if(snap.exists) return;
  const cats=await fs.collection('categorias').limit(1).get();
  const ops=[{op:'set',c:'config',obj:{...CFG_PADRAO}}];
  if(cats.empty) ops.push(...seedBasico());
  await commit(ops);
}
function marcarPresenca(online){
  if(!FIREBASE_ATIVO || !user || !perfil) return;
  fs.collection('usuarios').doc(user.uid).update({online, ultimoAcesso:new Date().toISOString()}).catch(()=>{});
}
function iniciarPresenca(){ pararPresenca(); marcarPresenca(true); _presTimer=setInterval(()=>marcarPresenca(!document.hidden),60000); }
function pararPresenca(){ clearInterval(_presTimer); _presTimer=null; }

FORMS.auth = async f=>{
  const email=f.email.value.trim(), btn=f.querySelector('button'), err=$('#authErr');
  btn.disabled=true; err.textContent='';
  try{
    if(S.authMode==='reset'){ await auth.sendPasswordResetEmail(email); err.className='pos'; err.textContent='Link enviado. Verifique seu e-mail.'; }
    else if(S.authMode==='cad'){ S.nomeCadastro=f.nome.value.trim(); const cr=await auth.createUserWithEmailAndPassword(email,f.senha.value); if(S.nomeCadastro) cr.user.updateProfile({displayName:S.nomeCadastro}).catch(()=>{}); }
    else await auth.signInWithEmailAndPassword(email,f.senha.value);
  }catch(e){ err.className='neg'; err.textContent=traduzErro(e); }

};

function lancFiltrados(){
  const f=S.f, q=f.busca.trim().toLowerCase(), [ot,oid]=f.origem?f.origem.split(':'):[];
  return db.lancamentos.filter(l=>{
    if(mesDe(l)!==S.mes) return false;
    if(f.tipo){ if(f.tipo==='transferencia'){ if(!['transferencia','pgto_fatura','aplicacao','resgate','meta_aporte','meta_retirada'].includes(l.tipo)) return false; } else if(l.tipo!==f.tipo) return false; }
    if(ot==='co' && l.contaId!==oid && l.contaDestinoId!==oid) return false;
    if(ot==='ca' && (l.cartaoId!==oid || !ehCartao(l))) return false;
    if(f.cat && l.categoriaId!==f.cat) return false;
    if(f.status==='pago' && !(l.pago||ehCartao(l))) return false;
    if(f.status==='pendente' && (l.pago||ehCartao(l))) return false;
    if(q && !((l.descricao||'').toLowerCase().includes(q) || (l.observacao||'').toLowerCase().includes(q))) return false;
    return true;
  });
}
function lancBody(){
  const lista=lancFiltrados().sort((a,b)=>a.data.localeCompare(b.data)||(a.criadoEm||'').localeCompare(b.criadoEm||''));

}

  const R=S.rel, fim = R.tipo==='mes' ? S.mes : R.tipo==='ano' ? R.ano+'-12' : R.ate.slice(0,7);
  let ini = R.tipo==='ano' ? R.ano+'-01' : R.tipo==='periodo' ? R.de.slice(0,7) : addMes(fim,-11);

}

function carregarFonte(f){
  if(f==='system' || !FONTES[f] || document.getElementById('gf-'+f)) return;
  const l=document.createElement('link'); l.id='gf-'+f; l.rel='stylesheet';
  l.href='https://fonts.googleapis.com/css2?family='+f+':wght@400;500;600;700;800&display=swap'; document.head.appendChild(l);
}
function aplicarLayout(C){
  C=C||cfg(); const r=document.documentElement;
  r.style.setProperty('--pri', /^#[0-9a-f]{6}$/i.test(C.corPrimaria)?C.corPrimaria:CFG_PADRAO.corPrimaria);
  r.style.setProperty('--r', {reto:'6px',medio:'14px',redondo:'22px'}[C.raio]||'14px');
  carregarFonte(C.fonte); r.style.setProperty('--font', FONTES[C.fonte]||FONTES.system);
  document.body.classList.toggle('compacto', C.densidade==='compacta');
  const side=$('.side'); if(side){ side.classList.toggle('side-escuro',C.menuEstilo==='escuro'); side.classList.toggle('side-cor',C.menuEstilo==='cor'); }
  const tp=lsGet('fluxxo_tema')||C.temaPadrao;
  r.dataset.theme = (tp==='dark'||tp==='light') ? tp : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const logo = C.logoImg ? `<img src="${esc(C.logoImg)}" alt="" style="width:30px;height:30px;border-radius:8px;object-fit:cover;flex-shrink:0">` : `<span style="flex-shrink:0">${esc(C.logo||'💸')}</span>`;
  const b=$('#brand'); if(b) b.innerHTML=`${logo}<span style="min-width:0"><span style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(C.nomeApp||'Fluxxo')}</span>${C.subtitulo?`<small>${esc(C.subtitulo)}</small>`:''}</span>`;
  document.title=(C.nomeApp||'Fluxxo')+(C.subtitulo?' — '+C.subtitulo:'');
  const tc=document.querySelector('meta[name=theme-color]'); if(tc) tc.content=C.corPrimaria;
  const fav=$('#favicon'); if(fav) fav.href = C.logoImg || 'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>${C.logo||'💸'}</text></svg>`);
}
function salvarCfg(patch,msg){
  const obj={...cfg(),...patch,id:'app'};
  return fbSet('config',obj).then(()=>{ lsSet('fluxxo_cfg',JSON.stringify(obj)); if(msg) toast(msg); }).catch(()=>{});
}
function abasConfig(){

}

  return {nomeApp:f.nomeApp.value.trim()||'Fluxxo', subtitulo:f.subtitulo.value.trim(), logo:f.logo.value.trim()||'💸', logoImg:f.logoImg.value,

function redimensionar(file,max){
  return new Promise((ok,falha)=>{ const img=new Image();
    img.onload=()=>{ const s=Math.min(img.width,img.height), c=document.createElement('canvas'); c.width=c.height=max;
      c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,max,max); URL.revokeObjectURL(img.src); ok(c.toDataURL('image/png')); };
    img.onerror=falha; img.src=URL.createObjectURL(file); });
}
CHG.logoFile = async t=>{

  catch(e){ toast('Não foi possível ler a imagem.',true); }
};

// ===== 10b. INVESTIMENTOS (RENDA FIXA) =====
// investimentos/{id}: {nome,tipo,instituicao,indexador:'cdi'|'selic'|'ipca'|'pre'|'poupanca',taxa,aportes:[{data,valor}],
//                      vencimento,liquidez:'diaria'|'vencimento',isento,resgatado,dataResgate,valorResgate}
// config/indices: {cdi,selic,ipca,tr} em % a.a. — informados pelo usuário ou buscados no Banco Central (SGS)
const TIPOS_INV = { // [nome, ícone, indexador padrão, taxa padrão, isento de IR, cor]
  cdb:['CDB','🏦','cdi',100,false,'#2f7cf6'], poupanca:['Poupança','🐷','poupanca',0,true,'#e93d82'],
  lci:['LCI','🏠','cdi',90,true,'#8e4ec6'], lca:['LCA','🌾','cdi',90,true,'#29a383'],
  tesouro_selic:['Tesouro Selic','🏛️','selic',100,false,'#12a150'], tesouro_ipca:['Tesouro IPCA+','📈','ipca',6,false,'#f76b15'],
  tesouro_pre:['Tesouro Prefixado','📌','pre',12,false,'#f5a524'], lc:['LC','💼','cdi',110,false,'#3e63dd'],
  debenture:['Debênture','🏭','ipca',7,false,'#ad7f58'], cri_cra:['CRI / CRA','🏢','ipca',6,true,'#0ea5a4'],
  outro:['Outro (renda fixa)','💰','pre',10,false,'#5b6b7b']
};
const INDEXADORES = {cdi:['% do CDI','Percentual do CDI (%)'], selic:['% da Selic','Percentual da Selic (%)'], ipca:['IPCA +','Taxa acima do IPCA (% a.a.)'], pre:['Prefixado','Taxa prefixada (% a.a.)'], poupanca:['Poupança','Regra da poupança']};
const IND_PADRAO = {id:'indices', cdi:14.9, selic:15.0, ipca:5.0, tr:1.5, atualizadoEm:null, fonte:'manual'};
function indices(){ return {...IND_PADRAO, ...(db.config.find(x=>x.id==='indices')||{})}; }
function tipoInv(t){ return TIPOS_INV[t] || TIPOS_INV.outro; }
function pctBR(v,d){ return (+v||0).toLocaleString('pt-BR',{minimumFractionDigits:d==null?2:d,maximumFractionDigits:d==null?2:d})+'%'; }
function rotuloIndexador(i){
  const t=+i.taxa||0;
  switch(i.indexador){ case 'cdi': return pctBR(t,t%1?2:0)+' do CDI'; case 'selic': return 'Selic'+(t===100?'':' ('+pctBR(t,0)+')');
    case 'ipca': return 'IPCA + '+pctBR(t)+' a.a.'; case 'pre': return 'Prefixado '+pctBR(t)+' a.a.'; case 'poupanca': return 'Regra da poupança'; }
  return '—';
}
function poupMensal(I){ I=I||indices(); const base = I.selic>8.5 ? 0.005 : Math.pow(1+I.selic*0.7/100,1/12)-1; return base + (Math.pow(1+I.tr/100,1/12)-1); }
function taxaAnualInv(i){
  const I=indices(), t=(+i.taxa||0)/100, diaria=a=>Math.pow(1+a/100,1/252)-1;
  switch(i.indexador){
    case 'cdi': return Math.pow(1+diaria(I.cdi)*t,252)-1;
    case 'selic': return Math.pow(1+diaria(I.selic)*(t||1),252)-1;
    case 'ipca': return (1+I.ipca/100)*(1+t)-1;
    case 'pre': return t;
    case 'poupanca': return Math.pow(1+poupMensal(I),12)-1;
  }
  return 0;
}
function diasEntre(a,b){ return Math.round((Date.parse(b+'T12:00:00')-Date.parse(a+'T12:00:00'))/864e5); }
function mesesCheios(a,b){ let m=mesesEntre(a.slice(0,7),b.slice(0,7)); if(+b.slice(8,10)<+a.slice(8,10)) m--; return Math.max(0,m); }
function aliqIR(d){ return d<=180?0.225:d<=360?0.20:d<=720?0.175:0.15; }
function calcInv(i){
  const tx=taxaAnualInv(i), pm=poupMensal();
  let fim = i.resgatado && i.dataResgate ? i.dataResgate : hoje();
  if(!i.resgatado && i.vencimento && i.vencimento<fim) fim=i.vencimento;
  let apl=0, bruto=0, ir=0;
  for(const a of (i.aportes||[])){
    const v0=+a.valor||0, d=Math.max(0,diasEntre(a.data,fim));
    const v = i.indexador==='poupanca' ? v0*Math.pow(1+pm,mesesCheios(a.data,fim)) : v0*Math.pow(1+tx,d/365);
    apl+=v0; bruto+=v; if(!i.isento) ir+=Math.max(0,v-v0)*aliqIR(d);
  }
  const liq=bruto-ir;
  return {apl:r2(apl), bruto:r2(bruto), rend:r2(bruto-apl), ir:r2(ir), liq:r2(liq), pct:apl?(bruto/apl-1)*100:0, taxa:tx*100, fim,
    final: i.resgatado ? r2(+i.valorResgate||liq) : r2(liq)};
}
function invAtivos(){ return db.investimentos.filter(i=>!i.resgatado); }
function totaisInv(){ let apl=0,bruto=0,liq=0,ir=0; for(const i of invAtivos()){ const c=calcInv(i); apl+=c.apl; bruto+=c.bruto; liq+=c.liq; ir+=c.ir; } return {apl:r2(apl),bruto:r2(bruto),liq:r2(liq),ir:r2(ir),rend:r2(bruto-apl)}; }
function resumoInvCard(){
  if(menuItem('investimentos').oculto) return '';
  const T=totaisInv(), at=invAtivos();
  return `<div class="card"><h3>${menuNome('investimentos')} <button class="btn sm" data-act="nav" data-v="investimentos">Ver carteira</button></h3>
    ${at.length?`<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px"><div><div class="mut" style="font-size:12px">Saldo bruto estimado</div><b style="font-size:20px">${fmt(T.bruto)}</b></div><div style="text-align:right"><div class="mut" style="font-size:12px">Rendimento</div><b class="pos">${fmt(T.rend)}</b></div></div>
    ${at.slice().sort((a,b)=>calcInv(b).bruto-calcInv(a).bruto).slice(0,4).map(i=>{ const c=calcInv(i), t=tipoInv(i.tipo); return `<div class="row" data-act="nav" data-v="investimentos" style="cursor:pointer">${icone({cor:t[5],icone:t[1]})}<div class="info"><div class="t">${esc(i.nome)}</div><div class="s">${t[0]} · ${rotuloIndexador(i)}</div></div><div class="v">${fmt(c.bruto)}</div></div>`; }).join('')}`
    :vazio('Cadastre seus investimentos de renda fixa.')}</div>`;
}

  const id=f.dataset.id, orig=byId('investimentos',id)||{}, agora=new Date().toISOString();
  const obj={...orig, id:id||uid_(), nome:f.nome.value.trim(), tipo:f.tipo.value, instituicao:f.instituicao.value.trim(), indexador:f.indexador.value,
    taxa:f.indexador.value==='poupanca'?0:r2(parseValor(f.taxa.value)), vencimento:f.vencimento.value||null, liquidez:f.liquidez.value, isento:f.isento.checked, resgatado:!!orig.resgatado};
  if(!obj.nome) return toast('Informe o nome do investimento.',true);
  if(obj.indexador!=='poupanca' && !(obj.taxa>0)) return toast('Informe a taxa de rentabilidade.',true);
  const ops=[];
  if(!id){
    const valor=r2(parseValor(f.valor.value)), data=f.data.value;
    if(!(valor>0)) return toast('Informe o valor aplicado.',true);

  }
  ops.unshift({op:'set',c:'investimentos',obj});
  closeModal(); commit(ops).then(()=>toast('Investimento salvo')).catch(()=>{});
};

ACT.buscarBCB = async t=>{
  const f=t.closest('form'), msg=$('#bcbMsg'); t.disabled=true; msg.textContent='Consultando o Banco Central…';
  const serie=async n=>{ const r=await fetch(`https://api.bcb.gov.br/dados/serie/bcdata.sgs.${n}/dados/ultimos/1?formato=json`); if(!r.ok) throw new Error(r.status); const j=await r.json(); return parseFloat(String(j[0].valor).replace(',','.')); };
  try{
    const [cdi,selic,ipca,trM]=await Promise.all([serie(4389),serie(432),serie(13522),serie(226)]);
    f.cdi.value=num(cdi); f.selic.value=num(selic); f.ipca.value=num(ipca); f.tr.value=num((Math.pow(1+trM/100,12)-1)*100); f.dataset.fonte='bcb';
    msg.innerHTML='<span class="pos">Valores atualizados pelo Banco Central (SGS). Clique em Salvar.</span>';
  }catch(e){ console.error('[bcb]',e); msg.innerHTML='<span class="neg">Não foi possível consultar o Banco Central agora. Informe os valores manualmente.</span>'; }
  finally{ t.disabled=false; }
};

function openModal(html,lg){
  const m=$('#modal'); m.className='modal'+(lg?' lg':''); m.innerHTML=html; $('#ov').classList.add('on');
  const first=m.querySelector('input:not([type=hidden]):not([type=checkbox]):not([type=radio]),select,textarea');
  if(first && window.innerWidth>760) setTimeout(()=>first.focus(),30);
}
function closeModal(){ const o=$('#ov'); if(o){ o.classList.remove('on'); $('#modal').innerHTML=''; } }
function confirmar(msg,onOk,extra){
  S.onConfirm=onOk;
  openModal(`<h2>Confirmar</h2><p>${msg}</p>${extra||''}<div class="mfoot"><button class="btn" data-act="closeModal">Cancelar</button><button class="btn red" data-act="okConfirm">Confirmar</button></div>`);
}
ACT.okConfirm = ()=>{ const fn=S.onConfirm, r=$('#modal input[name=escopo]:checked'), v=r?r.value:null; S.onConfirm=null; closeModal(); if(fn) fn(v); };
ACT.closeModal = ()=>closeModal();

}
function pickerIcone(sel){

// --- Lançamento (despesa | receita | transferencia | cartao)
function modalLanc(tipo,l,pre){
  pre=pre||{};
  const ed=!!(l && l.id);
  if(ed && l.tipo==='pgto_fatura') return modalPgto(l.cartaoId,l.faturaRef,l);
  if(ed) tipo = ehCartao(l) ? 'cartao' : l.tipo;
  const v = ed ? l : pre, contas=contasAtivas();
  const contaSel = v.contaId || (contas[0] && contas[0].id);
  const dt = v.data || (S.mes===hoje().slice(0,7) ? hoje() : S.mes+'-01');
  const pago = v.pago!==undefined ? v.pago : dt<=hoje();
  const titulo = {despesa:'despesa',receita:'receita',transferencia:'transferência',cartao:'despesa no cartão'}[tipo];
  const optsConta = sel => contas.concat(ed?db.contas.filter(c=>c.arquivada && (c.id===l.contaId||c.id===l.contaDestinoId)):[]).map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.nome)}</option>`).join('');
  const optsCat = `<option value="">Sem categoria</option>`+catsTipo(tipo==='receita'?'receita':'despesa').map(c=>`<option value="${c.id}" ${c.id===v.categoriaId?'selected':''}>${esc(c.icone+' '+c.nome)}</option>`).join('');
  let campos='';
  if(tipo==='transferencia'){
    const dest = v.contaDestinoId || (contas.find(c=>c.id!==contaSel)||{}).id;
    campos = `<div class="f2"><div class="fg"><label>Sai da conta</label><select name="conta">${optsConta(contaSel)}</select></div><div class="fg"><label>Entra na conta</label><select name="destino">${optsConta(dest)}</select></div></div>`;
  } else if(tipo==='cartao'){
    const cs = v.cartaoId || (db.cartoes[0]||{}).id;
    campos = `<div class="f2"><div class="fg"><label>Cartão</label><select name="cartao">${db.cartoes.map(c=>`<option value="${c.id}" ${c.id===cs?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></div><div class="fg"><label>Categoria</label><select name="cat">${optsCat}</select></div></div>`
      + (ed ? `<div class="fg"><label>Fatura (mês de vencimento)</label><input type="month" name="fatura" value="${l.faturaRef||''}"></div>` : '');
  } else {
    campos = `<div class="f2"><div class="fg"><label>Conta</label><select name="conta">${optsConta(contaSel)}</select></div><div class="fg"><label>Categoria</label><select name="cat">${optsCat}</select></div></div>`;
  }
  const rep = ed ? '' : `<div class="f2"><div class="fg"><label>Repetir</label><select name="rep" data-chg="rep"><option value="nao">Não repetir</option><option value="fixo">Fixo mensal</option>${tipo==='transferencia'?'':'<option value="parcelado">Parcelado</option>'}</select></div>
    <div class="fg hidden" id="qtdBox"><label id="qtdLb">Quantidade de meses</label><input name="qtd" type="number" min="2" max="360" value="12"></div></div><div id="repInfo" class="mut" style="font-size:12.5px;margin:-4px 0 10px"></div>`;
  const seg = ed ? '' : `<div class="seg" style="margin-bottom:16px">${[['despesa','Despesa','d'],['receita','Receita','r'],['cartao','Cartão','d'],['transferencia','Transferência','t']].map(([k,t,c])=>`<button type="button" class="${k===tipo?'on '+c:''}" data-act="mTipo" data-v="${k}">${t}</button>`).join('')}</div>`;
  openModal(`<h2>${ed?'Editar':'Nova'} ${titulo}</h2>${seg}
  <form data-form="lanc" data-tipo="${tipo}" data-id="${ed?l.id:''}" autocomplete="off">
    <div class="fg"><label>Descrição</label><input name="descricao" value="${esc(v.descricao||'')}" placeholder="${tipo==='receita'?'Ex.: Salário':tipo==='transferencia'?'Ex.: Reserva mensal':'Ex.: Supermercado'}" list="dlDesc" data-chg="descSug"><datalist id="dlDesc">${sugestoesDesc()}</datalist></div>
    <div class="f2"><div class="fg"><label>Valor (R$)</label><input name="valor" inputmode="decimal" value="${v.valor?num(v.valor):''}" placeholder="0,00" required></div>
      <div class="fg"><label>${tipo==='cartao'?'Data da compra':'Data'}</label><input type="date" name="data" value="${dt}" required></div></div>
    ${campos}
    ${tipo!=='cartao'?`<label class="chk fg"><input type="checkbox" name="pago" ${pago?'checked':''}> ${tipo==='receita'?'Recebido':tipo==='transferencia'?'Transferência realizada':'Pago'}</label>`:''}
    ${rep}
    ${ed && l.grupoId ? escopoHtml(false) : ''}
    <div class="fg"><label>Observação</label><textarea name="obs" rows="2">${esc(v.observacao||'')}</textarea></div>
    <div class="mfoot">${ed?`<button type="button" class="btn" style="margin-right:auto;color:var(--red)" data-act="delLanc" data-id="${l.id}">Excluir</button>`:''}<button type="button" class="btn" data-act="closeModal">Cancelar</button><button class="btn pri">Salvar</button></div>
  </form>`);
}

FORMS.lanc = f=>{
  const tipo=f.dataset.tipo, id=f.dataset.id, valor=r2(parseValor(f.valor.value)), data=f.data.value;
  if(!(valor>0)) return toast('Informe um valor maior que zero.',true);
  if(!data) return toast('Informe a data.',true);
  const base={descricao:f.descricao.value.trim()||(tipo==='transferencia'?'Transferência':'Sem descrição'), observacao:f.obs.value.trim()};
  let card=null;
  if(tipo==='transferencia'){
    Object.assign(base,{tipo:'transferencia',contaId:f.conta.value,contaDestinoId:f.destino.value,cartaoId:null,categoriaId:null,pago:f.pago.checked});
    if(base.contaId===base.contaDestinoId) return toast('Escolha contas diferentes.',true);
  } else if(tipo==='cartao'){
    card=byId('cartoes',f.cartao.value); if(!card) return toast('Cadastre um cartão primeiro.',true);
    Object.assign(base,{tipo:'despesa',cartaoId:card.id,contaId:null,contaDestinoId:null,categoriaId:f.cat.value||null,pago:true});
  } else {
    Object.assign(base,{tipo,contaId:f.conta.value,contaDestinoId:null,cartaoId:null,faturaRef:null,categoriaId:f.cat.value||null,pago:f.pago.checked});
  }
  if(tipo!=='cartao' && !base.contaId) return toast('Cadastre uma conta primeiro.',true);
  const ops=[];
  if(id){
    const orig=byId('lancamentos',id); if(!orig) return closeModal();
    const escopo=f.querySelector('input[name=escopo]:checked'), alvo = escopo && escopo.value==='prox' && orig.grupoId
      ? grupo(orig).filter(x=>(x.parcela||0)>=(orig.parcela||0)) : [orig];
    for(const g of alvo){
      const n={...g,...base,valor};
      if(g.id===orig.id){
        n.data=data;
        if(card){ const fInp=f.fatura && f.fatura.value;
          if(fInp && fInp!==orig.faturaRef) n.faturaRef=fInp;
          else if(data!==orig.data || card.id!==orig.cartaoId || !orig.faturaRef) n.faturaRef=faturaDe(card,data); }
      } else {
        n.pago=g.pago;
        if(card && card.id!==g.cartaoId) n.faturaRef=faturaDe(card,g.data);
      }
      if(!card) delete n.faturaRef;
      ops.push({op:'set',c:'lancamentos',obj:n});
    }
  } else {
    const rep=f.rep?f.rep.value:'nao', n=rep==='nao'?1:Math.max(2,Math.min(360,parseInt(f.qtd.value)||2));
    const grupoId = n>1 ? uid_() : null;
    let vals=Array(n).fill(valor);
    if(rep==='parcelado'){ const cent=Math.round(valor*100), b=Math.floor(cent/n), resto=cent-b*n; vals=Array.from({length:n},(_,i)=>(b+(i<resto?1:0))/100); }
    const fat0 = card ? faturaDe(card,data) : null, agora=new Date().toISOString();
    for(let i=0;i<n;i++){
      const o={...base,id:uid_(),valor:vals[i],data:addMesData(data,i),pago:i===0?base.pago:!!card,criadoEm:agora};
      if(grupoId){ o.grupoId=grupoId; o.parcela=i+1; o.recorrencia=rep; if(rep==='parcelado') o.totalParcelas=n; }
      if(card) o.faturaRef=addMes(fat0,i); else delete o.faturaRef;
      ops.push({op:'set',c:'lancamentos',obj:o});
    }
  }
  closeModal();

function movMeta(m,sinal,valor,data,contaSel){
  if(!contaSel) return null;
  const base={id:uid_(),valor,data,pago:data<=hoje(),metaId:m.id,metaValor:r2(sinal*valor),categoriaId:null,cartaoId:null,criadoEm:new Date().toISOString()};
  const desc=(sinal>0?'Guardar · ':'Retirada · ')+m.nome;
  if(m.contaId && byId('contas',m.contaId)){
    if(contaSel===m.contaId) return null;
    return sinal>0 ? {...base,tipo:'transferencia',descricao:desc,contaId:contaSel,contaDestinoId:m.contaId}
                   : {...base,tipo:'transferencia',descricao:desc,contaId:m.contaId,contaDestinoId:contaSel};
  }
  return {...base,tipo:sinal>0?'meta_aporte':'meta_retirada',descricao:desc,contaId:contaSel};
}
function ajusteMetas(lancs){
  const ops=[], por={};
  lancs.forEach(l=>{ if(l.metaId && l.metaValor) (por[l.metaId]=por[l.metaId]||[]).push(l); });
  for(const [mid,ls] of Object.entries(por)){
    const m=byId('metas',mid); if(!m) continue;
    const tot=ls.reduce((s,l)=>s+l.metaValor,0), ids=new Set(ls.map(l=>l.id));
    ops.push({op:'set',c:'metas',obj:{...m,valorAtual:Math.max(0,r2(m.valorAtual-tot)),historico:(m.historico||[]).filter(h=>!ids.has(h.lancId))}});
  }
  return ops;
}

  const origem=lanc && byId('contas',lanc.contaId), negativa = origem && (lanc.tipo==='meta_aporte'||lanc.contaDestinoId) && saldoConta(origem)-v<0;
  closeModal(); commit(ops).then(()=>toast(negativa?'Registrado — atenção: '+origem.nome+' ficou com saldo negativo.':(s>0?'Valor guardado 💪':'Retirada registrada')+(lanc?' · lançamento criado na conta':''),!!negativa)).catch(()=>{});
};

// ===== 9. IMPORTAÇÃO / EXPORTAÇÃO =====
function parseOFX(txt){
  const out=[];
  for(const b of txt.split(/<STMTTRN>/i).slice(1)){
    const g=tag=>{ const m=b.match(new RegExp('<'+tag+'>([^<\\r\\n]*)','i')); return m?m[1].trim():''; };
    const dt=g('DTPOSTED'), v=parseFloat(g('TRNAMT').replace(',','.'));
    if(dt.length<8 || isNaN(v) || !v) continue;
    out.push({data:dt.slice(0,4)+'-'+dt.slice(4,6)+'-'+dt.slice(6,8), valor:r2(v), descricao:(g('MEMO')||g('NAME')||'Lançamento importado').replace(/\s+/g,' '), fitid:g('FITID')});
  }
  return out;
}
function splitCSV(ln,sep){ const r=[]; let cur='', q=false; for(let i=0;i<ln.length;i++){ const ch=ln[i]; if(ch==='"'){ if(q && ln[i+1]==='"'){ cur+='"'; i++; } else q=!q; } else if(ch===sep && !q){ r.push(cur); cur=''; } else cur+=ch; } r.push(cur); return r; }
function parseCSV(txt){
  const linhas=txt.replace(/^﻿/,'').replace(/\r/g,'').split('\n').filter(x=>x.trim()); if(!linhas.length) return [];
  const sep=linhas[0].includes(';')?';':',', out=[];
  for(const ln of linhas){
    const cols=splitCSV(ln,sep); if(cols.length<3) continue;
    const d=cols[0].trim(); let data=null;
    if(/^\d{4}-\d{2}-\d{2}/.test(d)) data=d.slice(0,10);
    else { const m=d.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); if(m) data=(m[3].length===2?'20'+m[3]:m[3])+'-'+pad(m[2])+'-'+pad(m[1]); }
    const valor=r2(parseValor(cols[2]));
    if(!data || !valor) continue;
    out.push({data, descricao:cols[1].trim()||'Lançamento importado', valor, fitid:''});
  }
  return out;
}
CHG.impFile = async t=>{
  const file=t.files[0]; if(!file) return;
  const contaId=$('#impConta').value;
  try{
    const txt=await lerArquivo(file);
    const itens=/<OFX>|<STMTTRN>/i.test(txt)?parseOFX(txt):parseCSV(txt);
    t.value='';
    if(!itens.length) return toast('Nenhum lançamento reconhecido no arquivo.',true);
    const daConta=db.lancamentos.filter(l=>l.contaId===contaId);
    itens.forEach(it=>{
      const tp=it.valor>=0?'receita':'despesa';
      it.dup = daConta.some(l=>(it.fitid && l.fitid===it.fitid) || (l.data===it.data && Math.abs(+l.valor-Math.abs(it.valor))<0.005 && (l.descricao||'').toLowerCase()===it.descricao.toLowerCase()));
      it.sel=!it.dup; it.categoriaId=sugerirCat(it.descricao,tp,false);
    });
    S.imp={contaId,itens}; modalImport();
  }catch(e){ console.error(e); toast('Não foi possível ler o arquivo.',true); }
};
function modalImport(){
  const I=S.imp, conta=byId('contas',I.contaId), nd=I.itens.filter(i=>i.dup).length;
  openModal(`<h2>Importar extrato · ${esc(conta.nome)}</h2><p class="mut" style="margin-bottom:10px">${I.itens.length} lançamentos encontrados${nd?` · ${nd} já existente(s) desmarcado(s)`:''}. Revise as categorias antes de importar.</p>
  <div style="max-height:55vh;overflow:auto;border:1px solid var(--bd);border-radius:10px"><table class="tb"><thead><tr><th><input type="checkbox" data-chg="impAll" ${I.itens.every(i=>i.sel)?'checked':''}></th><th>Data</th><th>Descrição</th><th class="n">Valor</th><th>Categoria</th></tr></thead><tbody>
  ${I.itens.map((it,i)=>{ const tp=it.valor>=0?'receita':'despesa';
    return `<tr style="${it.dup?'opacity:.55':''}"><td><input type="checkbox" data-chg="impSel" data-i="${i}" ${it.sel?'checked':''}></td><td style="white-space:nowrap">${dataBR(it.data)}</td><td>${esc(it.descricao)}${it.dup?'<span class="badge">já importado</span>':''}</td><td class="n ${tp==='receita'?'pos':'neg'}">${fmt(it.valor)}</td>
    <td><select data-chg="impCat" data-i="${i}" style="min-width:150px;padding:6px 8px"><option value="">Sem categoria</option>${catsTipo(tp).map(c=>`<option value="${c.id}" ${c.id===it.categoriaId?'selected':''}>${esc(c.icone+' '+c.nome)}</option>`).join('')}</select></td></tr>`; }).join('')}
  </tbody></table></div>
  <div class="mfoot"><button class="btn" data-act="closeModal">Cancelar</button><button class="btn pri" data-act="importOk">Importar selecionados</button></div>`,true);
}
CHG.impSel = t=>{ S.imp.itens[+t.dataset.i].sel=t.checked; };
CHG.impCat = t=>{ S.imp.itens[+t.dataset.i].categoriaId=t.value; };
CHG.impAll = t=>{ S.imp.itens.forEach(i=>i.sel=t.checked); document.querySelectorAll('#modal [data-chg=impSel]').forEach(c=>c.checked=t.checked); };
ACT.importOk = ()=>{
  const I=S.imp, agora=new Date().toISOString();
  const ops=I.itens.filter(i=>i.sel).map(it=>({op:'set',c:'lancamentos',obj:{id:uid_(),tipo:it.valor>=0?'receita':'despesa',descricao:it.descricao,valor:Math.abs(it.valor),data:it.data,contaId:I.contaId,cartaoId:null,categoriaId:it.categoriaId||null,pago:true,fitid:it.fitid||null,importado:true,criadoEm:agora}}));
  if(!ops.length) return toast('Nenhum item selecionado.',true);
  S.imp=null; closeModal(); commit(ops).then(()=>toast(ops.length+' lançamentos importados')).catch(()=>{});
};
function csvLanc(lista){
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const h=['Data','Descrição','Tipo','Categoria','Conta/Cartão','Valor','Situação','Parcela','Fatura','Observação'];
  const rows=lista.slice().sort((a,b)=>a.data.localeCompare(b.data)).map(l=>[
    dataBR(l.data), l.descricao, TIPO_NOME[l.tipo], catVisual(l).nome, origemNome(l).replace('💳 ',''),
    (['despesa','pgto_fatura','aplicacao','meta_aporte'].includes(l.tipo)?'-':'')+String((+l.valor).toFixed(2)).replace('.',','),
    ehCartao(l)?'Cartão':(l.pago?'Pago':'Pendente'), l.totalParcelas?l.parcela+'/'+l.totalParcelas:'', l.faturaRef||'', l.observacao||''
  ].map(q).join(';'));
  return '﻿'+[h.map(q).join(';')].concat(rows).join('\r\n');
}
ACT.exportMes = ()=>baixar('lancamentos_'+S.mes+'.csv', csvLanc(lancFiltrados()), 'text/csv;charset=utf-8');
ACT.exportRel = ()=>baixar('relatorio_'+relTitulo().replace(/[^\w-]+/g,'_')+'.csv', csvLanc(db.lancamentos.filter(relFiltro())), 'text/csv;charset=utf-8');
ACT.exportTudo = ()=>baixar('lancamentos_completo_'+hoje()+'.csv', csvLanc(db.lancamentos), 'text/csv;charset=utf-8');
ACT.exportJSON = ()=>{ const dados={}; COLS.concat(['config']).forEach(c=>dados[c]=db[c]); baixar('fluxxo_backup_'+hoje()+'.json', JSON.stringify({app:'fluxxo',versao:2,exportadoEm:new Date().toISOString(),dados},null,1), 'application/json'); };
CHG.jsonFile = async t=>{
  const file=t.files[0]; t.value=''; if(!file) return;
  try{
    const j=JSON.parse(await lerArquivo(file)), d=j.dados||j;
    if(!d || !Array.isArray(d.lancamentos)) return toast('Arquivo de backup inválido.',true);
    const ops=[]; COLS.concat(ehAdmin()?['config']:[]).forEach(c=>(Array.isArray(d[c])?d[c]:[]).forEach(o=>{ if(o && o.id) ops.push({op:'set',c,obj:o}); }));
    confirmar(`Restaurar <b>${ops.length}</b> registros do backup? Registros com o mesmo ID serão sobrescritos; os demais serão mantidos.`,()=>commit(ops).then(()=>toast('Backup restaurado')).catch(()=>{}));
  }catch(e){ toast('Não foi possível ler o backup.',true); }
};

function bindEventos(){
  if(window._fluxoInit) return; window._fluxoInit=true;
  document.addEventListener('click',e=>{
    if(e.target.id==='ov'){ closeModal(); return; }
    const t=e.target.closest('[data-act]');
    if(!t){ if(S.fab && !e.target.closest('#fabMenu')) toggleFab(false); return; }
    const fn=ACT[t.dataset.act];
    if(fn){ e.preventDefault(); try{ fn(t,e); }catch(err){ console.error('[acao]',t.dataset.act,err); toast('Erro: '+err.message,true); } }
  });
  document.addEventListener('submit',e=>{ const f=e.target, fn=FORMS[f.dataset.form]; if(fn){ e.preventDefault(); try{ fn(f); }catch(err){ console.error('[form]',f.dataset.form,err); toast('Erro: '+err.message,true); } } });
  document.addEventListener('change',e=>{ const t=e.target, fn=t.dataset && CHG[t.dataset.chg]; if(fn) fn(t); });
  document.addEventListener('input',e=>{ const t=e.target, fn=t.dataset && INP[t.dataset.inp]; if(fn) fn(t); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if($('#ov').classList.contains('on')) closeModal(); else if(S.fab) toggleFab(false); } });
}
function iniciar(){
  aplicarLayout(cfgCache()); bindEventos();
  document.addEventListener('visibilitychange',()=>marcarPresenca(!document.hidden));
  window.addEventListener('pagehide',()=>marcarPresenca(false));
  if(FIREBASE_ATIVO){ initFirebase(); return; }
  user={uid:'demo',email:'admin@demo.local',displayName:'Administrador (demo)'};
  if(!carregarLocal()) seedDemo();
  perfil=db.usuarios.find(u=>u.id==='demo')||{id:'demo',nome:'Administrador (demo)',papel:'admin',status:'ativo'};
  pronto();
  if(firebaseConfig.apiKey && !SDK_OK) toast('SDK do Firebase não carregou — usando modo demonstração.',true);
}
iniciar();
